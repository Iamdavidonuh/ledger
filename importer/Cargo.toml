[package]
name = "importer"
version = "0.1.0"
edition = "2021"

[dependencies]
ledger-core = { path = "../core" }
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
csv = "1"

[dev-dependencies]
rust_decimal_macros = "1"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
