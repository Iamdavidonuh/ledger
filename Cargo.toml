[workspace]
resolver = "2"
members = ["core", "api", "importer"]

[workspace.package]
version = "0.1.0"

# release-please's "rust" strategy, configured at this repo's root ("."),
# always tries to bump [package].version in the Cargo.toml at that path
# too, in addition to every workspace member -- a pure [workspace]-only
# manifest with no [package] table has no such field, and that update
# throws (verified against release-please's own source, not guessed).
# This package exists only so that update has somewhere to land; nothing
# depends on it. publish = false since it's not a real crate to ship.
#
# version is a literal string, not version.workspace = true: release-
# please's updater does a direct TOML path replace expecting a plain
# string at package.version, and a workspace-inherited reference there
# is a table, not a string -- confirmed live, it fails the whole run
# ("value at path package.version is not tagged") rather than silently
# misbehaving. The two fields are independent now; keep them in sync by
# hand on the rare occasion the workspace default actually needs to move.
[package]
name = "ledger-workspace"
version = "0.1.0"
edition = "2021"
publish = false
