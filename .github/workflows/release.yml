name: Release

# Only release-please itself runs on every push to main, and it never
# builds or pushes anything -- it just keeps an open PR up to date with a
# changelog. Images only get built when that PR is actually merged, which
# is what makes release_created true below.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase path; the owner is hardcoded rather
      # than derived from github.repository_owner, which GitHub Actions
      # has no built-in way to lowercase.
      - name: Build and push ledger-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/iamdavidonuh/ledger-api:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/iamdavidonuh/ledger-api:latest
          cache-from: type=gha,scope=ledger-api
          cache-to: type=gha,mode=max,scope=ledger-api

      - name: Build and push ledger-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/iamdavidonuh/ledger-frontend:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/iamdavidonuh/ledger-frontend:latest
          cache-from: type=gha,scope=ledger-frontend
          cache-to: type=gha,mode=max,scope=ledger-frontend
